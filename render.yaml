services:
  # Long-running WhatsApp worker with optional Telegram pairing controller.
  - type: web
    name: anime-md
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      # Optional display name for the person operating this deployment.
      - key: OWNER_NAME
        sync: false
      - key: AUTH_METHOD
        value: pairing
      - key: AUTH_DIR
        value: /var/data/session
      - key: DATA_DIR
        value: /var/data/data
      - key: PUBLIC_MODE
        value: "true"
      # Optional: restore a paired session when the disk is not attached.
      # Raw JSON or base64 contents of session/creds.json.
      - key: SESSION_ID
        sync: false
    disk:
      name: anime-md-auth-data
      mountPath: /var/data
      sizeGB: 1
